<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-container-login">

    <form class="auth-form" action="/registere" method="post">

      <h1>Login</h1>

      <input
        type="email"
        placeholder="Enter email"
        required
      >

      <input
        type="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        Login
      </button>

      <p>
        Don't have an account?
        <a href="register.html">
          Register
        </a>
      </p>

    </form>

  </div>

</body>
</html>
